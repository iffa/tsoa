name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable --mode=skip-build
      - run: yarn build
      # Type-aware lint reads route fixtures that the tests generate.
      - run: yarn test
      - run: yarn check
      # Yarn exchanges the GitHub OIDC token for a publish token when YARN_NPM_AUTH_TOKEN is empty.
      - name: Publish
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: yarn workspaces foreach --all --no-private --topological npm publish --provenance --tolerate-republish
